name: 问题反馈
description: 插件没按预期工作
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 你做了什么，期望看到什么，实际看到了什么。截图很有帮助。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. ...
        2. ...
  - type: input
    id: versions
    attributes:
      label: 版本
      description: DSH 版本、插件版本（设置 → 插件里能看到）、操作系统
    validations:
      required: true
  - type: markdown
    attributes:
      value: 贴日志或截图前请去掉个人信息和记忆内容里的隐私。
